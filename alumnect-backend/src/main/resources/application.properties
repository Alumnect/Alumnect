# 1. Đường dẫn kết nối tới Database PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alumnect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# 2. Cấu hình Hibernate (Chỉ kiểm tra cấu trúc chứ không tự tạo bảng nữa)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Cấu hình Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 4. Cấu hình Mail Service (Gmail SMTP - Cần bật Mật khẩu ứng dụng nếu dùng thật)
# Mặc định sẽ log link xác nhận ra console nếu cấu hình SMTP bị sai/không đúng mật khẩu
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 5. Cấu hình Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# 6. Debug Auto-configuration & Flyway & Spring Web Mappings
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.web=DEBUG

# 7. Cấu hình bảo mật JWT Token
app.jwt.secret=${JWT_SECRET:MTIzNDU2NDU5OThEMzIxM0F6eGMzNTE2NTQzMjEzMjE2NTQ5OHEzMTNhMnMxZDMyMnp4M2MyMQ==}
# Access Token: 24 giờ (86400000 ms)
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh Token: 7 ngày (604800000 ms) — BR-03
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# 8. Cấu hình Cloudflare R2 (S3-compatible Storage)
app.r2.endpoint=${R2_ENDPOINT:https://<cloudflare-account-id>.r2.cloudflarestorage.com}
app.r2.access-key=${R2_ACCESS_KEY:your_r2_access_key}
app.r2.secret-key=${R2_SECRET_KEY:your_r2_secret_key}
app.r2.bucket-name=${R2_BUCKET_NAME:alumnect}
app.r2.public-url=${R2_PUBLIC_URL:https://pub-xxxx.r2.dev}
